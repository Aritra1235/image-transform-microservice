services:
  image-transform:
    build:
      context: .
      dockerfile: Dockerfile
    image: image-transform-bun
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 8080
    ports:
      - "8080:8080"
    init: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - >-
          fetch('http://127.0.0.1:8080/healthz').then(r => {
            if (!r.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
